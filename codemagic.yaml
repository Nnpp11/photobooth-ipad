workflows:
  ios-development:
    name: Photobooth iOS Build
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build
        script: |
          xcodebuild \
            -project Photobooth/Photobooth.xcodeproj \
            -scheme Photobooth \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        script: |
          cd ~/Library/Developer/Xcode/DerivedData/Photobooth-*/Build/Products/Debug-iphoneos/
          mkdir -p Payload
          cp -r Photobooth.app Payload/
          zip -r Photobooth.ipa Payload/
          cp Photobooth.ipa $CM_BUILD_DIR/
    artifacts:
      - $CM_BUILD_DIR/Photobooth.ipa
